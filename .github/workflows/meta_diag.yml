name: Meta diag
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка нового META_PAGE_TOKEN
        env:
          TOK: ${{ secrets.META_PAGE_TOKEN }}
        run: |
          if [ -z "$TOK" ]; then echo "META_PAGE_TOKEN: ПУСТО"; exit 0; fi
          echo "токен найден, длина ${#TOK}"
          echo "--- страница:"
          curl -s "https://graph.facebook.com/v21.0/131906467328515?fields=name,instagram_business_account&access_token=$TOK"
          echo
